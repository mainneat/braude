<title>Atlas des artifacts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mind map horizontale — racine au centre, projets en deux colonnes, connecteurs SVG courbes */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#17191a; --muted:#6a6f6c; --line:#c9ccc6; --soft:#e7e9e4;
  --c1:#2f6bff; --c2:#d9480f; --c3:#0b8a5f; --c4:#8a3ffc; --c5:#b8860b; --c6:#c2255c; --c7:#1098ad; --c8:#5c6370;
  --display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111314; --surface:#1a1d1e; --fg:#eceeea; --muted:#9aa09c; --line:#3a3f3d; --soft:#24282a;
  --c1:#7aa2ff; --c2:#ff8a5c; --c3:#45c999; --c4:#b58cff; --c5:#e3b341; --c6:#f06595; --c7:#4fc3d4; --c8:#a0a7b4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111314; --surface:#1a1d1e; --fg:#eceeea; --muted:#9aa09c; --line:#3a3f3d; --soft:#24282a;
  --c1:#7aa2ff; --c2:#ff8a5c; --c3:#45c999; --c4:#b58cff; --c5:#e3b341; --c6:#f06595; --c7:#4fc3d4; --c8:#a0a7b4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;margin-bottom:24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#q{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:220px;max-width:100%}
#q:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.chip{font:500 12px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stats{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 200px minmax(0,1fr);gap:28px 56px;align-items:start}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke-width:1.6;opacity:.55}
.col{display:flex;flex-direction:column;gap:22px;min-width:0;position:relative;z-index:1}
.root{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;z-index:1;margin-top:120px;
  background:var(--fg);color:var(--bg);border-radius:16px;padding:20px 18px;text-align:center}
.root b{display:block;font:700 22px var(--display);letter-spacing:-.01em}
.root span{font:12px var(--mono);opacity:.75}

.proj{background:var(--surface);border:1px solid var(--soft);border-radius:12px;padding:14px 16px 12px;min-width:0}
.proj h2{margin:0;display:flex;align-items:baseline;gap:10px;font:650 17px var(--display);letter-spacing:-.01em}
.proj h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none;transform:translateY(-1px)}
.proj h2 .n{margin-left:auto;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.proj .desc{color:var(--muted);font-size:13px;margin:2px 0 8px 20px}
.grp{margin:8px 0 0 4px;padding-left:16px;border-left:1.5px solid color-mix(in srgb,var(--k) 45%,transparent)}
.grp h3{margin:0 0 6px -16px;padding-left:10px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--k);position:relative}
.grp h3::before{content:"";position:absolute;left:0;top:50%;width:7px;border-top:1.5px solid color-mix(in srgb,var(--k) 45%,transparent)}
.leaves{display:flex;flex-wrap:wrap;gap:6px}
.leaf{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:7px;background:var(--soft);color:var(--fg);text-decoration:none;font-size:13px;border:1px solid transparent;transition:border-color .15s,background .15s}
.leaf:hover{border-color:var(--k);background:color-mix(in srgb,var(--k) 10%,var(--surface))}
.leaf .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf time{font:10.5px var(--mono);color:var(--muted);flex:none}
.leaf.hot{box-shadow:inset 0 0 0 1.5px var(--k)}
.empty{color:var(--muted);font-size:13px;padding:20px 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px;font:12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--muted);margin-right:6px;vertical-align:-1px}

@media (max-width:900px){
  .map{grid-template-columns:minmax(0,1fr);gap:18px}
  .root{position:static;margin-top:0;order:-1}
  svg.links{display:none}
  #q{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Atlas des artifacts</h1>
      <p class="sub">Les <span id="total">94</span> artifacts publiés depuis Claude Code, regroupés par projet puis par nature. Chaque pastille ouvre l'artifact.</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Filtrer (ex. swap, audit, DS)" aria-label="Filtrer les artifacts">
      <button class="chip" id="recent" aria-pressed="false">Modifiés en novembre</button>
      <span class="stats" id="stats"></span>
    </div>
  </header>

  <div class="map" id="map">
    <svg class="links" id="links" aria-hidden="true"></svg>
    <div class="col" id="left"></div>
    <div class="root"><b>Louis · Claude Code</b><span id="rootn">94 artifacts</span></div>
    <div class="col" id="right"></div>
  </div>

  <div class="legend"><span><i></i>contour = modifié dans les 7 derniers jours</span><span>dates au format JJ.MM (2026)</span></div>
</div>

const TODAY = new Date("2026-11-20");
const isHot = d => (TODAY - new Date("2026-"+d)) / 864e5 <= 7;
const fmt = d => d.slice(3)+"."+d.slice(0,2);
const q = document.getElementById("q"), recentBtn = document.getElementById("recent");
const L = document.getElementById("left"), R = document.getElementById("right");
const total = P.reduce((s,p)=>s+p.groups.reduce((t,g)=>t+g[1].length,0),0);
document.getElementById("total").textContent = total;
document.getElementById("rootn").textContent = total + " artifacts · " + P.length + " projets";

function render(){
  const term = q.value.trim().toLowerCase(), onlyNov = recentBtn.getAttribute("aria-pressed")==="true";
  L.innerHTML = ""; R.innerHTML = ""; let shown = 0;
  P.forEach((p,i)=>{
    const projHit = term && (p.name+" "+p.desc).toLowerCase().includes(term);
    const groups = p.groups.map(([g,items])=>[g, items.filter(([t,,d])=>{
      if(onlyNov && !d.startsWith("11")) return false;
      if(!term || projHit) return true;
      return (t+" "+g).toLowerCase().includes(term);
    })]).filter(([,it])=>it.length);
    const n = groups.reduce((s,g)=>s+g[1].length,0);
    if(!n) return; shown += n;
    const el = document.createElement("section");
    el.className = "proj"; el.dataset.i = i; el.style.setProperty("--k", `var(${p.k})`);
    el.innerHTML = `<h2><span class="dot"></span>${p.name}<span class="n">${n}</span></h2><p class="desc">${p.desc}</p>` +
      groups.map(([g,items])=>`<div class="grp"><h3>${g}</h3><div class="leaves">${items.map(([t,id,d])=>
        `<a class="leaf${isHot(d)?" hot":""}" href="${A(id)}" target="_blank" rel="noopener" title="${t}"><span class="t">${t}</span><time>${fmt(d)}</time></a>`).join("")}</div></div>`).join("");
    (p.side==="L"?L:R).appendChild(el);
  });
  document.getElementById("stats").textContent = shown + " / " + total;
  if(!shown){ L.innerHTML = '<p class="empty">Aucun artifact ne correspond à ce filtre.</p>'; }
  requestAnimationFrame(draw);
}

function draw(){
  const svg = document.getElementById("links"), map = document.getElementById("map");
  const root = map.querySelector(".root");
  if(getComputedStyle(svg).display==="none") return;
  const mb = map.getBoundingClientRect(), rb = root.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${mb.width} ${mb.height}`);
  const cy = rb.top - mb.top + rb.height/2;
  svg.innerHTML = [...map.querySelectorAll(".proj")].map(el=>{
    const b = el.getBoundingClientRect(), left = el.parentElement.id==="left";
    const y = b.top - mb.top + 22;
    const x1 = left ? rb.left - mb.left : rb.right - mb.left;
    const x2 = left ? b.right - mb.left : b.left - mb.left;
    const mx = (x1+x2)/2;
    const col = getComputedStyle(el).getPropertyValue("--k") || "currentColor";
    return `<path d="M${x1},${cy} C${mx},${cy} ${mx},${y} ${x2},${y}" stroke="${col}"/>`;
  }).join("");
}

q.addEventListener("input", render);
recentBtn.addEventListener("click", ()=>{ recentBtn.setAttribute("aria-pressed", recentBtn.getAttribute("aria-pressed")==="true"?"false":"true"); render(); });
addEventListener("resize", ()=>requestAnimationFrame(draw));
addEventListener("scroll", ()=>requestAnimationFrame(draw), {passive:true});
document.fonts && document.fonts.ready.then(draw);
render();
</script>
