<title>Component Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --ca-bg: #f5f5f2;
  --ca-surface: #ffffff;
  --ca-sunken: #ecece8;
  --ca-ink: #1b1b19;
  --ca-ink-2: #5b5b55;
  --ca-ink-3: #8a8a83;
  --ca-line: #deded8;
  --ca-line-strong: #b8b8b0;
  --ca-accent: #c2410c;
  --ca-accent-ink: #ffffff;
  --ca-focus: #c2410c;
  --ca-ok: #3f6b3a;
  --ca-warn: #8a5a00;
  --ca-err: #b42318;
  --ca-font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --ca-font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ca-radius: 6px;
  /* Données : rampe séquentielle bleue (5 marches validées, ordinale), série unique, encre dans les cases. */
  --ca-seq-1: #86b6ef; --ca-seq-2: #5598e7; --ca-seq-3: #2a78d6; --ca-seq-4: #1c5cab; --ca-seq-5: #0d366b;
  --ca-seq-ink-1: #0b0b0b; --ca-seq-ink-2: #ffffff; --ca-seq-ink-3: #ffffff; --ca-seq-ink-4: #ffffff; --ca-seq-ink-5: #ffffff;
  --ca-series: #2a78d6;
  --ca-near-l: var(--ca-line-strong);
  --ca-near-d: transparent;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ca-bg: #151514;
    --ca-surface: #1d1d1b;
    --ca-sunken: #242422;
    --ca-ink: #ecebe5;
    --ca-ink-2: #a8a79f;
    --ca-ink-3: #7c7b74;
    --ca-line: #31312e;
    --ca-line-strong: #4b4b46;
    --ca-accent: #fb8a5a;
    --ca-accent-ink: #1b1b19;
    --ca-focus: #fb8a5a;
    --ca-ok: #93c48b;
    --ca-warn: #e5b45a;
    --ca-err: #ff8a7a;
    --ca-seq-1: #184f95; --ca-seq-2: #2a78d6; --ca-seq-3: #5598e7; --ca-seq-4: #86b6ef; --ca-seq-5: #cde2fb;
    --ca-seq-ink-1: #ffffff; --ca-seq-ink-2: #ffffff; --ca-seq-ink-3: #ffffff; --ca-seq-ink-4: #0b0b0b; --ca-seq-ink-5: #0b0b0b;
    --ca-series: #3987e5;
    --ca-near-l: transparent;
    --ca-near-d: var(--ca-line-strong);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ca-bg: #151514;
  --ca-surface: #1d1d1b;
  --ca-sunken: #242422;
  --ca-ink: #ecebe5;
  --ca-ink-2: #a8a79f;
  --ca-ink-3: #7c7b74;
  --ca-line: #31312e;
  --ca-line-strong: #4b4b46;
  --ca-accent: #fb8a5a;
  --ca-accent-ink: #1b1b19;
  --ca-focus: #fb8a5a;
  --ca-ok: #93c48b;
  --ca-warn: #e5b45a;
  --ca-err: #ff8a7a;
  --ca-seq-1: #184f95; --ca-seq-2: #2a78d6; --ca-seq-3: #5598e7; --ca-seq-4: #86b6ef; --ca-seq-5: #cde2fb;
  --ca-seq-ink-1: #ffffff; --ca-seq-ink-2: #ffffff; --ca-seq-ink-3: #ffffff; --ca-seq-ink-4: #0b0b0b; --ca-seq-ink-5: #0b0b0b;
  --ca-series: #3987e5;
  --ca-near-l: transparent;
  --ca-near-d: var(--ca-line-strong);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ca-bg);
  color: var(--ca-ink);
  font: 400 14px/1.5 var(--ca-font-sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ca-focus); outline-offset: 2px; border-radius: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.mono, code, pre, .count, .eyebrow, .dim, .occ, .stats { font-family: var(--ca-font-mono); }
.muted { color: var(--ca-ink-2); }

.wrap {
  max-width: 1440px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 max(48px, env(safe-area-inset-bottom, 0px));
}

/* En-tête */
.mast {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--ca-bg);
  border-bottom: 1px solid var(--ca-line);
  padding-top: 14px;
}
.mast-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--ca-ink-2); }
.stats b { font-weight: 500; color: var(--ca-ink); }
.tabs { display: flex; gap: 20px; margin-top: 10px; }
.tab {
  padding: 6px 0 9px;
  text-decoration: none;
  font-size: 13px;
  color: var(--ca-ink-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ca-ink); }
.tab[aria-current="page"] { color: var(--ca-ink); font-weight: 500; border-bottom-color: var(--ca-accent); }

/* Filtres */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
  padding-block: 16px;
  border-bottom: 1px solid var(--ca-line);
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field-label {
  font: 500 11px/1 var(--ca-font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ca-ink-3);
}
.field select, .field input {
  height: 32px;
  min-width: 0;
  max-width: 100%;
  padding: 0 10px;
  border: 1px solid var(--ca-line-strong);
  border-radius: var(--ca-radius);
  background: var(--ca-surface);
  font-size: 13px;
}
.field input { width: 220px; }
.field input::placeholder { color: var(--ca-ink-3); }
.result-count { margin-left: auto; font: 12px var(--ca-font-mono); color: var(--ca-ink-2); padding-bottom: 8px; }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--ca-line-strong); border-radius: var(--ca-radius); background: var(--ca-surface); }
.seg-btn {
  height: 26px;
  padding: 0 10px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  font-size: 12px;
  color: var(--ca-ink-2);
  cursor: pointer;
}
.seg-btn:hover { color: var(--ca-ink); }
.seg-btn[aria-checked="true"] { background: var(--ca-ink); color: var(--ca-bg); }

.btn {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--ca-line-strong);
  border-radius: var(--ca-radius);
  background: var(--ca-surface);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ca-ink-2); }
.btn-small { height: 28px; font-size: 12px; }

/* Vue Par type */
#view { min-height: 50vh; }
.type { padding-top: 32px; }
.type-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ca-ink);
}
.type-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.count { font-size: 12px; color: var(--ca-ink-3); }
.project { padding-top: 16px; }
.project-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: var(--ca-ink-2); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 12px;
  align-items: start;
}
@media (max-width: 520px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
}
.specimen {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--ca-line);
  border-radius: var(--ca-radius);
  background: var(--ca-surface);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: border-color 120ms ease;
}
.specimen:hover { border-color: var(--ca-line-strong); }
.specimen:focus-visible { outline-offset: 1px; border-radius: var(--ca-radius); }
/* Zone d'aperçu : hauteur fixée par le script d'ajustement (≤ 240 px). L'hôte du shadow root
   ne porte que taille et transformation ; l'apparence (fond, police) vient du CSS de l'artifact. */
.preview { overflow: hidden; max-height: 240px; min-width: 0; }
.tile { display: block; min-width: 0; transform-origin: 0 0; }
.scaled { font: 11px var(--ca-font-mono); color: var(--ca-ink-3); }
.specimen-project { font-size: 12px; color: var(--ca-ink-2); }
.specimen-cap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 10px 9px;
  border-top: 1px solid var(--ca-line);
}
.specimen-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.specimen-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 18px; }
.dim, .occ { font-size: 11px; color: var(--ca-ink-3); }
.occ { color: var(--ca-ink-2); }
.badge {
  display: inline-flex;
  align-items: center;
  height: 16px;
  padding: 0 5px;
  border: 1px solid var(--ca-accent);
  border-radius: 3px;
  color: var(--ca-accent);
  font: 600 10px/1 var(--ca-font-mono);
  letter-spacing: 0.04em;
}

/* États */
.state, .empty { padding: 48px 0; max-width: 560px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.state-title { font-size: 16px; font-weight: 600; }
.state-error .state-title { color: var(--ca-err); }
.skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; width: 100%; max-width: none; }
.state-loading { max-width: none; }
.skeleton span { height: 150px; border: 1px solid var(--ca-line); border-radius: var(--ca-radius); background: var(--ca-surface); animation: pulse 1.4s ease-in-out infinite alternate; }
.skeleton span:nth-child(2n) { animation-delay: 0.2s; }
.skeleton span:nth-child(3n) { animation-delay: 0.4s; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }

/* Fiche */
.detail { padding-top: 20px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.back { font-size: 13px; color: var(--ca-ink-2); text-decoration: none; align-self: flex-start; }
.back:hover { color: var(--ca-ink); text-decoration: underline; }
.detail-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ca-ink-2); }
.detail-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; overflow-wrap: anywhere; }
.lede { max-width: 640px; color: var(--ca-ink-2); }
.detail-stage { border: 1px solid var(--ca-line); border-radius: var(--ca-radius); background: var(--ca-surface); overflow: hidden; min-width: 0; }
.stage-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--ca-line); font: 12px var(--ca-font-mono); }
.stage-scroll { max-height: 70vh; overflow: auto; }
.stage-scroll:focus-visible { outline-offset: -2px; }
.detail-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
@media (max-width: 860px) { .detail-cols { grid-template-columns: minmax(0, 1fr); } }
.panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { font: 500 11px/1 var(--ca-font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ca-ink-3); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
.metrics th, .metrics td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--ca-line); vertical-align: middle; white-space: nowrap; }
.metrics thead th { font: 500 11px var(--ca-font-mono); color: var(--ca-ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.metrics tbody th { font-weight: 400; color: var(--ca-ink-2); }
.metrics td { font-family: var(--ca-font-mono); font-size: 12px; }
.sw { display: inline-flex; align-items: center; gap: 6px; }
.chip { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
.sources { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sources li { overflow-wrap: anywhere; }
.panel .btn { align-self: flex-start; }
.code {
  margin: 0;
  max-height: 320px;
  overflow: auto;
  padding: 12px;
  border: 1px solid var(--ca-line);
  border-radius: var(--ca-radius);
  background: var(--ca-sunken);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Vues de comparaison (Matrice, Couleurs, Mesures) */
.viz-block { padding-top: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.viz-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.viz-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.viz-head p { max-width: 640px; margin-top: 4px; }
.viz-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.viz { overflow-x: auto; max-width: 100%; border: 1px solid var(--ca-line); border-radius: var(--ca-radius); background: var(--ca-surface); padding: 8px 0; }
.viz svg { display: block; max-width: none; overflow: visible; }
.viz svg text { font: 12px var(--ca-font-sans); }
.viz [tabindex]:focus { outline: none; }
.viz [tabindex] { cursor: pointer; }
.ax-label { fill: var(--ca-ink-2); }
.ax-tick { fill: var(--ca-ink-3); font-family: var(--ca-font-mono) !important; font-size: 11px !important; }
.ax-title { fill: var(--ca-ink-3); font-size: 11px !important; }
.ax-value { fill: var(--ca-ink); font-family: var(--ca-font-mono) !important; font-size: 11px !important; }
.grid-line { stroke: var(--ca-line); stroke-width: 1; }
.axis-line { stroke: var(--ca-line-strong); stroke-width: 1; }
.hit { fill: transparent; }
.mx-rect { fill: var(--ca-sunken); }
.mx-cell:not(.mx-empty):hover .mx-rect, .mx-cell:focus-visible .mx-rect { stroke: var(--ca-ink); stroke-width: 2; }
.mx-count { font: 500 12px var(--ca-font-mono) !important; pointer-events: none; }
.seq-1 { fill: var(--ca-seq-1); } .seq-2 { fill: var(--ca-seq-2); } .seq-3 { fill: var(--ca-seq-3); }
.seq-4 { fill: var(--ca-seq-4); } .seq-5 { fill: var(--ca-seq-5); }
.seq-ink-1 { fill: var(--ca-seq-ink-1); } .seq-ink-2 { fill: var(--ca-seq-ink-2); } .seq-ink-3 { fill: var(--ca-seq-ink-3); }
.seq-ink-4 { fill: var(--ca-seq-ink-4); } .seq-ink-5 { fill: var(--ca-seq-ink-5); }
.seq-legend { display: inline-flex; align-items: center; gap: 2px; font: 11px var(--ca-font-mono); }
.seq-legend .muted:first-child { margin-right: 4px; }
.seq-legend .muted:last-child { margin-left: 4px; }
.seq-key { width: 18px; height: 12px; border-radius: 2px; }
.seq-bg-1 { background: var(--ca-seq-1); } .seq-bg-2 { background: var(--ca-seq-2); } .seq-bg-3 { background: var(--ca-seq-3); }
.seq-bg-4 { background: var(--ca-seq-4); } .seq-bg-5 { background: var(--ca-seq-5); }
.sw-band { fill: var(--ca-sunken); }
.sw-mark { stroke: var(--ca-surface); stroke-width: 2; }
.sw-mark.near-l { stroke: var(--ca-near-l, var(--ca-surface)); stroke-width: 1.5; }
.sw-mark.near-d { stroke: var(--ca-near-d, var(--ca-surface)); stroke-width: 1.5; }
.sw-mark.near-l.near-d { stroke: var(--ca-line-strong); }
.sw-dot:hover .sw-mark, .sw-dot:focus-visible .sw-mark, .sw-dot.is-active .sw-mark { stroke: var(--ca-ink); stroke-width: 2; }
.st-mark { fill: var(--ca-series); stroke: var(--ca-surface); stroke-width: 2; }
.st-dot:hover .st-mark, .st-dot:focus-visible .st-mark, .st-dot.is-active .st-mark { stroke: var(--ca-ink); }
.strip { padding-top: 20px; gap: 8px; }
.strip-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--ca-line); }
.strip-head h3 { font-size: 14px; font-weight: 600; }
.viz-detail { display: flex; flex-direction: column; gap: 10px; min-height: 24px; }
.viz-hint { font-size: 12px; }
.viz-detail-title { display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 500; }
.grid-small { grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); }
.grid-small .preview { max-height: 120px; }
.viz-table summary { cursor: pointer; font-size: 12px; color: var(--ca-ink-2); }
.viz-table summary:hover { color: var(--ca-ink); }
.viz-table .metrics { margin-top: 8px; }
.viz-table .metrics td { white-space: normal; }

/* Non analysés */
.foot { margin-top: 48px; }
.unanalysed { border-top: 1px solid var(--ca-line); padding-top: 12px; }
.unanalysed summary { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ca-ink-2); }
.unanalysed summary:hover { color: var(--ca-ink); }
.status-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.status-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; overflow-wrap: anywhere; }
.status { font: 500 11px var(--ca-font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
.status-skipped { color: var(--ca-warn); }
.status-error { color: var(--ca-err); }
.notes { margin-top: 16px; font-size: 13px; }
.notes h3 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.notes ul { margin: 0; padding-left: 18px; }

@media (max-width: 520px) {
  .toolbar { gap: 10px 12px; }
  .field { flex: 1 1 calc(50% - 6px); }
  .field-q { flex-basis: 100%; }
  .field input { width: 100%; }
  .field select { width: 100%; }
  .result-count { margin-left: 0; padding-bottom: 0; }
  .detail-head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div class="wrap">
  <header class="mast">
    <div class="mast-row">
      <p class="brand">Component Atlas</p>
      <p id="stats" class="stats" aria-live="polite"></p>
    </div>
    <nav id="tabs" class="tabs" aria-label="Vues"></nav>
  </header>

  <div id="toolbar" class="toolbar" role="search" aria-label="Filtres" hidden>
    <label class="field"><span>Projet</span><select id="f-project"></select></label>
    <label class="field"><span>Type</span><select id="f-type"></select></label>
    <label class="field field-q"><span>Recherche</span><input id="f-q" type="search" placeholder="Nom ou projet" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>Période</span>
      <select id="f-period">
        <option value="all">Toute la période</option>
        <option value="30">30 derniers jours</option>
        <option value="90">90 derniers jours</option>
        <option value="365">12 derniers mois</option>
      </select>
    </label>
    <div class="field"><span>Rendu</span><div id="render-theme"></div></div>
    <p id="result-count" class="result-count" aria-live="polite"></p>
  </div>

  <main id="view" aria-busy="true">
    <div class="state state-loading">
      <p class="muted">Chargement de l’atlas…</p>
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </main>

  <footer id="unanalysed" class="foot"></footer>
</div>
<!--APP-->
