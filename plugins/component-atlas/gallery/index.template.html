<title>Component Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --sunken: #ecece8;
  --ink: #1b1b19;
  --ink-2: #5b5b55;
  --ink-3: #8a8a83;
  --line: #deded8;
  --line-strong: #b8b8b0;
  --accent: #c2410c;
  --accent-ink: #ffffff;
  --focus: #c2410c;
  --ok: #3f6b3a;
  --warn: #8a5a00;
  --err: #b42318;
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514;
    --surface: #1d1d1b;
    --sunken: #242422;
    --ink: #ecebe5;
    --ink-2: #a8a79f;
    --ink-3: #7c7b74;
    --line: #31312e;
    --line-strong: #4b4b46;
    --accent: #fb8a5a;
    --accent-ink: #1b1b19;
    --focus: #fb8a5a;
    --ok: #93c48b;
    --warn: #e5b45a;
    --err: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151514;
  --surface: #1d1d1b;
  --sunken: #242422;
  --ink: #ecebe5;
  --ink-2: #a8a79f;
  --ink-3: #7c7b74;
  --line: #31312e;
  --line-strong: #4b4b46;
  --accent: #fb8a5a;
  --accent-ink: #1b1b19;
  --focus: #fb8a5a;
  --ok: #93c48b;
  --warn: #e5b45a;
  --err: #ff8a7a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.5 var(--font-sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.mono, code, pre, .count, .eyebrow, .dim, .occ, .stats { font-family: var(--font-mono); }
.muted { color: var(--ink-2); }

.wrap {
  max-width: 1440px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 max(48px, env(safe-area-inset-bottom, 0px));
}

/* En-tête */
.mast {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: 14px;
}
.mast-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--ink-2); }
.stats b { font-weight: 500; color: var(--ink); }
.tabs { display: flex; gap: 20px; margin-top: 10px; }
.tab {
  padding: 6px 0 9px;
  text-decoration: none;
  font-size: 13px;
  color: var(--ink-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }

/* Filtres */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
  padding-block: 16px;
  border-bottom: 1px solid var(--line);
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field-label {
  font: 500 11px/1 var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.field select, .field input {
  height: 32px;
  min-width: 0;
  max-width: 100%;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 13px;
}
.field input { width: 220px; }
.field input::placeholder { color: var(--ink-3); }
.result-count { margin-left: auto; font: 12px var(--font-mono); color: var(--ink-2); padding-bottom: 8px; }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.seg-btn {
  height: 26px;
  padding: 0 10px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn[aria-checked="true"] { background: var(--ink); color: var(--bg); }

.btn {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn-small { height: 28px; font-size: 12px; }

/* Vue Par type */
#view { min-height: 50vh; }
.type { padding-top: 32px; }
.type-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ink);
}
.type-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.count { font-size: 12px; color: var(--ink-3); }
.project { padding-top: 16px; }
.project-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
  gap: 12px;
  align-items: start;
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
.specimen {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: border-color 120ms ease;
}
.specimen:hover { border-color: var(--line-strong); }
.specimen:focus-visible { outline-offset: 1px; border-radius: var(--radius); }
/* L'hôte du shadow root : le cadre est ici, l'apparence (fond, police) vient du CSS de l'artifact. */
.tile { display: block; max-height: 240px; overflow: hidden; min-width: 0; }
.specimen-cap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 10px 9px;
  border-top: 1px solid var(--line);
}
.specimen-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.specimen-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 18px; }
.dim, .occ { font-size: 11px; color: var(--ink-3); }
.occ { color: var(--ink-2); }
.badge {
  display: inline-flex;
  align-items: center;
  height: 16px;
  padding: 0 5px;
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: var(--accent);
  font: 600 10px/1 var(--font-mono);
  letter-spacing: 0.04em;
}

/* États */
.state, .empty { padding: 48px 0; max-width: 560px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.state-title { font-size: 16px; font-weight: 600; }
.state-error .state-title { color: var(--err); }
.skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px; width: 100%; max-width: none; }
.state-loading { max-width: none; }
.skeleton span { height: 150px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); animation: pulse 1.4s ease-in-out infinite alternate; }
.skeleton span:nth-child(2n) { animation-delay: 0.2s; }
.skeleton span:nth-child(3n) { animation-delay: 0.4s; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }

/* Fiche */
.detail { padding-top: 20px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.back { font-size: 13px; color: var(--ink-2); text-decoration: none; align-self: flex-start; }
.back:hover { color: var(--ink); text-decoration: underline; }
.detail-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.detail-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; overflow-wrap: anywhere; }
.lede { max-width: 640px; color: var(--ink-2); }
.detail-stage { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; min-width: 0; }
.stage-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font: 12px var(--font-mono); }
.tile-large { max-height: 70vh; overflow: auto; }
.detail-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
@media (max-width: 860px) { .detail-cols { grid-template-columns: minmax(0, 1fr); } }
.panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
.metrics th, .metrics td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.metrics thead th { font: 500 11px var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.metrics tbody th { font-weight: 400; color: var(--ink-2); }
.metrics td { font-family: var(--font-mono); font-size: 12px; }
.sw { display: inline-flex; align-items: center; gap: 6px; }
.chip { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
.sources { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sources li { overflow-wrap: anywhere; }
.panel .btn { align-self: flex-start; }
.code {
  margin: 0;
  max-height: 320px;
  overflow: auto;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--sunken);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Non analysés */
.foot { margin-top: 48px; }
.unanalysed { border-top: 1px solid var(--line); padding-top: 12px; }
.unanalysed summary { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.unanalysed summary:hover { color: var(--ink); }
.status-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.status-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; overflow-wrap: anywhere; }
.status { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
.status-skipped { color: var(--warn); }
.status-error { color: var(--err); }
.notes { margin-top: 16px; font-size: 13px; }
.notes h3 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.notes ul { margin: 0; padding-left: 18px; }

@media (max-width: 520px) {
  .toolbar { gap: 10px 12px; }
  .field { flex: 1 1 calc(50% - 6px); }
  .field-q { flex-basis: 100%; }
  .field input { width: 100%; }
  .field select { width: 100%; }
  .result-count { margin-left: 0; padding-bottom: 0; }
  .detail-head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div class="wrap">
  <header class="mast">
    <div class="mast-row">
      <p class="brand">Component Atlas</p>
      <p id="stats" class="stats" aria-live="polite"></p>
    </div>
    <nav id="tabs" class="tabs" aria-label="Vues"></nav>
  </header>

  <div id="toolbar" class="toolbar" role="search" aria-label="Filtres" hidden>
    <label class="field"><span>Projet</span><select id="f-project"></select></label>
    <label class="field"><span>Type</span><select id="f-type"></select></label>
    <label class="field field-q"><span>Recherche</span><input id="f-q" type="search" placeholder="Nom ou projet" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span>Période</span>
      <select id="f-period">
        <option value="all">Toute la période</option>
        <option value="30">30 derniers jours</option>
        <option value="90">90 derniers jours</option>
        <option value="365">12 derniers mois</option>
      </select>
    </label>
    <div class="field"><span>Rendu</span><div id="render-theme"></div></div>
    <p id="result-count" class="result-count" aria-live="polite"></p>
  </div>

  <main id="view" aria-busy="true">
    <div class="state state-loading">
      <p class="muted">Chargement de l’atlas…</p>
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </main>

  <footer id="unanalysed" class="foot"></footer>
</div>
