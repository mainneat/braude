<!doctype html>
<html>
<head><meta charset="utf-8"><style>button { background: #2f6bff; color: #fff; }</style></head>
<body>
<div id="app"><button>Disparaît en sombre</button></div>
<script>
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {

});
</script>
