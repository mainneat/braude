<!doctype html>
<html><head><meta charset="utf-8"><title>App shell</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f3f3f1; color: #111; }
  .app { display: grid; grid-template-columns: 640px minmax(0, 1fr); min-height: 100vh; }
  .side { background: #e4e4e2; padding: 24px; }
  .app-main { padding: 420px 32px 32px; background: #fafaf8; }
  .page-h { display: flex; justify-content: flex-end; align-items: center; height: 80px; }
  .btn { background: #111; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font: 500 14px/1 system-ui; }
  .far { position: relative; left: 3000px; }
</style></head>
<body>
<div class="app">
  <aside class="side"><p>Menu</p></aside>
  <main class="app-main">
    <div class="page">
      <header class="page-h"><h1>Activity</h1><button class="btn" type="button">Statements</button></header>
      <p><button class="btn far" type="button">Lost</button></p>
    </div>
  </main>
</div>
</body></html>
